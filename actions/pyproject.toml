[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "buntzen-actions"
version = "0.3.2"
description = "Isolated Playwright actions for the Buntzen Pass Bot control plane."
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.62.0",
]

[project.scripts]
buntzen-actions = "buntzen_actions.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
