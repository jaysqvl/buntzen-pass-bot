[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-pass-actions"
version = "0.6.1"
description = "Supervised Playwright actions for the Lake Pass Bot control plane."
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.62.0",
]

[project.scripts]
lake-pass-actions = "lake_pass_actions.worker:main"
# Legacy launcher for existing operator configurations.
buntzen-actions = "lake_pass_actions.worker:main"

[dependency-groups]
dev = ["setuptools==84.0.0"]

[tool.uv]
# Install the backend from the hash-verified lock before building this project.
# An isolated PEP 517 dependency resolution would bypass those locked hashes.
no-build-isolation-package = ["lake-pass-actions"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
