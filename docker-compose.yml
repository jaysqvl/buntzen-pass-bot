services:
  buntzen-pass-bot:
    build: .
    container_name: buntzen-pass-bot
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      APPDATA_DIR: /appdata
      BUNTZEN_MASTER_KEY_FILE: "${BUNTZEN_MASTER_KEY_FILE:-}"
      BLUEBUBBLES_URL: "${BLUEBUBBLES_URL:-http://bluebubbles.example:1234}"
      BUNTZEN_YODEL_ORIGINS: "${BUNTZEN_YODEL_ORIGINS:-https://yodelportal.com}"
      BUNTZEN_ALLOWED_HOSTS: "${BUNTZEN_ALLOWED_HOSTS:-}"
      BUNTZEN_ALLOWED_ORIGINS: "${BUNTZEN_ALLOWED_ORIGINS:-}"
      BUNTZEN_PUBLIC_ORIGIN: "${BUNTZEN_PUBLIC_ORIGIN:-}"
      BUNTZEN_TRUSTED_PROXIES: "${BUNTZEN_TRUSTED_PROXIES:-}"
      BUNTZEN_SETUP_TOKEN: "${BUNTZEN_SETUP_TOKEN:-}"
      BUNTZEN_LOG_LEVEL: "${BUNTZEN_LOG_LEVEL:-info}"
      BUNTZEN_DEBUG: "${BUNTZEN_DEBUG:-false}"
      BUNTZEN_BROWSER_EXECUTABLE: "${BUNTZEN_BROWSER_EXECUTABLE:-}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      SCHEDULES_ENABLED: "${SCHEDULES_ENABLED:-false}"
    volumes:
      - ./appdata:/appdata
      # Opt into a separate host key directory; the default preserves first boot.
      - type: bind
        source: "${BUNTZEN_KEY_DIRECTORY_PATH:-./appdata}"
        target: /run/buntzen-key
        read_only: true
        bind:
          create_host_path: false
    shm_size: "1gb"
    security_opt:
      - "seccomp=./docker/seccomp_profile.json"
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
