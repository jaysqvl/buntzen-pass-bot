services:
  lake-pass-bot:
    build: .
    container_name: lake-pass-bot
    restart: unless-stopped
    init: true
    ports:
      - "${LAKE_PASS_WEB_PORT-${WEB_PORT:-8080}}:8080"
    environment:
      APPDATA_DIR: /appdata
      LAKE_PASS_MASTER_KEY_FILE: "${LAKE_PASS_MASTER_KEY_FILE-${BUNTZEN_MASTER_KEY_FILE:-}}"
      BLUEBUBBLES_URL: "${BLUEBUBBLES_URL:-http://bluebubbles.example:1234}"
      LAKE_PASS_BLUEBUBBLES_ENDPOINTS: "${LAKE_PASS_BLUEBUBBLES_ENDPOINTS-${BUNTZEN_BLUEBUBBLES_ENDPOINTS:-}}"
      LAKE_PASS_YODEL_ORIGINS: "${LAKE_PASS_YODEL_ORIGINS-${BUNTZEN_YODEL_ORIGINS:-https://yodelportal.com}}"
      # Private LAN hosting accepts any hostname unless checks are enabled.
      LAKE_PASS_HOST_CHECK_ENABLED: "${LAKE_PASS_HOST_CHECK_ENABLED-${BUNTZEN_HOST_CHECK_ENABLED:-false}}"
      LAKE_PASS_ALLOWED_HOSTS: "${LAKE_PASS_ALLOWED_HOSTS-${BUNTZEN_ALLOWED_HOSTS:-}}"
      LAKE_PASS_ALLOWED_ORIGINS: "${LAKE_PASS_ALLOWED_ORIGINS-${BUNTZEN_ALLOWED_ORIGINS:-}}"
      LAKE_PASS_PUBLIC_ORIGIN: "${LAKE_PASS_PUBLIC_ORIGIN-${BUNTZEN_PUBLIC_ORIGIN:-}}"
      LAKE_PASS_TRUSTED_PROXIES: "${LAKE_PASS_TRUSTED_PROXIES-${BUNTZEN_TRUSTED_PROXIES:-}}"
      LAKE_PASS_SETUP_TOKEN: "${LAKE_PASS_SETUP_TOKEN-${BUNTZEN_SETUP_TOKEN:-}}"
      LAKE_PASS_LOG_LEVEL: "${LAKE_PASS_LOG_LEVEL-${BUNTZEN_LOG_LEVEL:-info}}"
      LAKE_PASS_DEBUG: "${LAKE_PASS_DEBUG-${BUNTZEN_DEBUG:-false}}"
      LAKE_PASS_BROWSER_EXECUTABLE: "${LAKE_PASS_BROWSER_EXECUTABLE-${BUNTZEN_BROWSER_EXECUTABLE:-}}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      SCHEDULES_ENABLED: "${SCHEDULES_ENABLED:-false}"
    volumes:
      - ./appdata:/appdata
      # Opt into a separate host key directory; the default preserves first boot.
      - type: bind
        source: "${LAKE_PASS_KEY_DIRECTORY_PATH-${BUNTZEN_KEY_DIRECTORY_PATH:-./appdata}}"
        target: /run/buntzen-key
        read_only: true
        bind:
          create_host_path: false
    shm_size: "1gb"
    cpus: "${LAKE_PASS_CPU_LIMIT-${BUNTZEN_CPU_LIMIT:-2.0}}"
    mem_limit: "${LAKE_PASS_MEMORY_LIMIT-${BUNTZEN_MEMORY_LIMIT:-4g}}"
    memswap_limit: "${LAKE_PASS_MEMORY_LIMIT-${BUNTZEN_MEMORY_LIMIT:-4g}}"
    pids_limit: ${LAKE_PASS_PIDS_LIMIT-${BUNTZEN_PIDS_LIMIT:-512}}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,nosuid,nodev
      - /home/pwuser:size=128m,uid=1001,gid=1001,mode=0700,nosuid,nodev
    security_opt:
      - "seccomp=./docker/seccomp_profile.json"
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
