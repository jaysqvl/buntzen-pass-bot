services:
  buntzen-pass-bot:
    build: .
    container_name: buntzen-pass-bot
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      APPDATA_DIR: /appdata
      BLUEBUBBLES_URL: "${BLUEBUBBLES_URL:-http://bluebubbles.example:1234}"
      BUNTZEN_YODEL_ORIGINS: "${BUNTZEN_YODEL_ORIGINS:-https://yodelportal.com}"
      BUNTZEN_ALLOWED_HOSTS: "${BUNTZEN_ALLOWED_HOSTS:-}"
      BUNTZEN_ALLOWED_ORIGINS: "${BUNTZEN_ALLOWED_ORIGINS:-}"
      BUNTZEN_SETUP_TOKEN: "${BUNTZEN_SETUP_TOKEN:-}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      SCHEDULES_ENABLED: "${SCHEDULES_ENABLED:-false}"
    volumes:
      - ./appdata:/appdata
    shm_size: "1gb"
    security_opt:
      - "seccomp=./docker/seccomp_profile.json"
    stop_grace_period: 45s
