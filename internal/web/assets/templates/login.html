{{define "content"}}
<section class="login-card">
  <p class="eyebrow">Local administration</p>
  <h1>Buntzen Bot</h1>
  <p>Sign in to manage profiles, OTP sources, and booking jobs.</p>
  {{if .Error}}<div class="flash error">{{.Error}}</div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>Admin password<input type="password" name="password" required autofocus autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
{{end}}
{{template "base" .}}
