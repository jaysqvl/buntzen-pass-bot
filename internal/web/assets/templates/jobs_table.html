{{define "jobs_table"}}
<p class="table-hint">Scroll horizontally to see all columns.</p>
<div class="table-wrap" role="region" aria-label="Job history" tabindex="0">
<table>
  <thead><tr><th scope="col">Job</th><th scope="col">Profile</th><th scope="col">Action</th><th scope="col">Status</th><th scope="col">Confirmation</th><th scope="col">Earliest start</th><th scope="col">Created</th></tr></thead>
  <tbody>
  {{range .Jobs}}
    <tr><td><a href="/jobs/{{.ID}}">{{.ShortID}}</a></td><td>{{.ProfileName}}</td><td>{{.Command}}</td><td><span class="pill {{.StatusClass}}">{{.StatusLabel}}</span></td><td>{{.ModeLabel}}</td><td>{{.DueLabel}}</td><td>{{.CreatedLabel}}</td></tr>
  {{else}}<tr><td colspan="7" class="empty">No jobs yet.</td></tr>{{end}}
  </tbody>
</table>
</div>
{{end}}
