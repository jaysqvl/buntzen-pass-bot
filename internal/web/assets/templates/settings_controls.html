{{define "settings-controls"}}
<div class="form-grid{{if .Class}} {{.Class}}{{end}}">
  {{range .Fields}}
    {{if eq .Type "checkbox"}}
    <label class="check{{if .Wide}} field-wide{{end}}" for="field-{{.Name}}"><input type="checkbox" name="{{.Name}}" value="1" id="field-{{.Name}}"{{if .Help}} aria-describedby="help-{{.Name}}"{{end}} {{if .Checked}}checked{{end}}><span>{{.Label}}{{if .Help}}<small class="field-help" id="help-{{.Name}}">{{.Help}}</small>{{end}}</span></label>
    {{else if eq .Type "select"}}
    <label class="field{{if .Wide}} field-wide{{end}}" for="field-{{.Name}}"><span>{{.Label}}</span><select name="{{.Name}}" id="field-{{.Name}}"{{if .Help}} aria-describedby="help-{{.Name}}"{{end}} {{if .Required}}required{{end}}>{{range .Options}}<option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>{{end}}</select>{{if .Help}}<small class="field-help" id="help-{{.Name}}">{{.Help}}</small>{{end}}</label>
    {{else}}
    <label class="field{{if .Wide}} field-wide{{end}}" for="field-{{.Name}}"><span>{{.Label}}</span><input type="{{.Type}}" name="{{.Name}}" value="{{.Value}}" id="field-{{.Name}}"{{if .Help}} aria-describedby="help-{{.Name}}"{{end}} {{if .Required}}required{{end}} {{if .Step}}step="{{.Step}}"{{end}} {{if .Min}}min="{{.Min}}"{{end}} {{if .Max}}max="{{.Max}}"{{end}}>{{if .Help}}<small class="field-help" id="help-{{.Name}}">{{.Help}}</small>{{end}}</label>
    {{end}}
  {{end}}
</div>
{{end}}
