name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Release metadata consistency
        run: python3 scripts/check_release_config.py
      - name: Public-tree privacy guard
        run: python3 scripts/check_public_tree.py
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal integration)"
      - name: Verify module checksums
        run: go mod verify
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Shell syntax
        run: |
          bash -n scripts/docker_smoke.sh
          python3 -m py_compile scripts/check_release_config.py scripts/check_build_backend.py scripts/docker_*_smoke.py scripts/release/*.py scripts/release/tests/*.py
      - name: Release publication tests
        run: python3 -m unittest discover -s scripts/release/tests
      - name: Vet
        run: go vet ./...
      - name: Unit and package tests
        run: go test -race -count=1 ./...
      - name: Browser client event tests
        run: node --test internal/web/testdata/client.test.cjs
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  python-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lock file
        shell: bash
        run: |
          uv lock --check --project actions
          diff -u \
            <(tail -n +3 actions/requirements.lock) \
            <(uv export --project actions --locked --format requirements-txt --no-dev --no-emit-project | tail -n +3)
      - name: Sync locked environment
        run: uv sync --project actions --locked
      - name: Lint
        run: uvx --from ruff==0.12.10 ruff check actions scripts/check_build_backend.py scripts/docker_*_smoke.py scripts/release integration/*.py
      - name: Tests
        run: uv run --project actions python -m unittest discover -s actions/tests
      - name: Compile package
        run: uv run --project actions python -m compileall -q actions/src
      - name: Build distributions with the pinned backend
        run: |
          uv export --project actions --locked --only-group dev --format requirements-txt --no-emit-project --output-file /tmp/lake-pass-build-requirements.txt
          uv build actions --no-config --build-constraints /tmp/lake-pass-build-requirements.txt --require-hashes --out-dir /tmp/lake-pass-dist
      - name: Reject altered build backend artifacts
        run: uv run --project actions --locked python scripts/check_build_backend.py
      - name: Dependency audit
        run: |
          uv export --project actions --locked --format requirements-txt --no-dev --no-emit-project --output-file /tmp/lake-pass-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --disable-pip -r /tmp/lake-pass-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --disable-pip -r /tmp/lake-pass-build-requirements.txt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked Python environment
        run: uv sync --project actions --locked
      - name: Install Playwright Chromium
        run: uv run --project actions playwright install --with-deps chromium
      - name: Vet browser integration
        run: go vet -tags=integration ./integration/...
      - name: Browser integration
        run: LAKE_PASS_E2E_PYTHON="$PWD/actions/.venv/bin/python" go test -race -count=1 -tags=integration -timeout=5m ./integration/...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, python-actions, integration]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose
        env:
          BLUEBUBBLES_URL: http://bluebubbles.example:1234
          LAKE_PASS_ALLOWED_HOSTS: lake-pass.example
          LAKE_PASS_APPDATA_PATH: /tmp/lake-pass-appdata
          LAKE_PASS_SECCOMP_PROFILE_PATH: /tmp/lake-pass-seccomp.json
          LAKE_PASS_WEB_PORT: "18091"
        run: |
          docker compose -f deploy/portainer.yml config --format json | jq -e '
            .services["lake-pass-bot"].image == "ghcr.io/jaysqvl/lake-pass-bot:latest"
          ' >/dev/null
          export LAKE_PASS_IMAGE=ghcr.io/example/lake-pass-bot@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose -f deploy/portainer.yml config --format json | jq -e --arg image "$LAKE_PASS_IMAGE" '
            .services["lake-pass-bot"].image == $image
          ' >/dev/null
          for manifest in docker-compose.yml deploy/portainer.yml; do
            docker compose -f "$manifest" config --format json | jq -e '
              .services["lake-pass-bot"] |
              (.cpus | tonumber) == 2 and
              (.mem_limit | tonumber) == (4 * 1024 * 1024 * 1024) and
              (.memswap_limit | tonumber) == (4 * 1024 * 1024 * 1024) and
              .pids_limit == 512 and .read_only == true and
              (.tmpfs | length == 2) and
              (.volumes | any(.target == "/run/buntzen-key" and .read_only == true))
            ' >/dev/null
            LAKE_PASS_KEY_DIRECTORY_PATH=/tmp/separate-key \
              LAKE_PASS_MASTER_KEY_FILE=/run/buntzen-key/master.key \
              docker compose -f "$manifest" config --format json | jq -e '
                .services["lake-pass-bot"] |
                .environment.LAKE_PASS_MASTER_KEY_FILE == "/run/buntzen-key/master.key" and
                (.volumes | any(.source == "/tmp/separate-key" and .target == "/run/buntzen-key" and .read_only == true))
              ' >/dev/null
          done
      - name: Validate legacy Compose settings during upgrade
        env:
          BLUEBUBBLES_URL: http://bluebubbles.example:1234
          BUNTZEN_ALLOWED_HOSTS: legacy.example
          BUNTZEN_APPDATA_PATH: /tmp/legacy-appdata
          BUNTZEN_SECCOMP_PROFILE_PATH: /tmp/legacy-seccomp.json
          BUNTZEN_WEB_PORT: "18092"
          BUNTZEN_IMAGE: ghcr.io/example/legacy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BUNTZEN_MASTER_KEY_FILE: /run/buntzen-key/master.key
          BUNTZEN_DEBUG: "true"
        run: |
          docker compose -f deploy/portainer.yml config --format json | jq -e --arg image "$BUNTZEN_IMAGE" '
            .services["lake-pass-bot"] |
            .image == $image and
            .environment.LAKE_PASS_ALLOWED_HOSTS == "legacy.example" and
            .environment.LAKE_PASS_MASTER_KEY_FILE == "/run/buntzen-key/master.key" and
            .environment.LAKE_PASS_DEBUG == "true" and
            (.ports | any(.published == "18092")) and
            (.volumes | any(.source == "/tmp/legacy-appdata" and .target == "/appdata")) and
            (.volumes | any(.source == "/tmp/legacy-appdata" and .target == "/run/buntzen-key" and .read_only == true))
          ' >/dev/null
          LAKE_PASS_DEBUG=false LAKE_PASS_MASTER_KEY_FILE= \
            docker compose -f deploy/portainer.yml config --format json | jq -e '
              .services["lake-pass-bot"].environment |
              .LAKE_PASS_DEBUG == "false" and .LAKE_PASS_MASTER_KEY_FILE == ""
            ' >/dev/null
      - name: Build amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            LAKE_PASS_VERSION=0.0.0-ci
            LAKE_PASS_REVISION=${{ github.sha }}
          context: .
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          push: false
          platforms: linux/amd64
          tags: lake-pass-bot:ci
      - name: Runtime container smoke test
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash scripts/docker_smoke.sh lake-pass-bot:ci 0.0.0-ci "$EXPECTED_REVISION"
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          image-ref: lake-pass-bot:ci
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
