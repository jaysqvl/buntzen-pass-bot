name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Release metadata consistency
        run: python3 scripts/check_release_config.py
      - name: Public-tree privacy guard
        run: python3 scripts/check_public_tree.py
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal integration)"
      - name: Verify module checksums
        run: go mod verify
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Shell syntax
        run: |
          bash -n scripts/docker_smoke.sh scripts/deploy/portainer.sh scripts/deploy/tests/test_portainer.sh
          python3 -m py_compile scripts/check_release_config.py scripts/deploy/tests/*.py
      - name: Portainer deployment integration
        run: bash scripts/deploy/tests/test_portainer.sh
      - name: Vet
        run: go vet ./...
      - name: Unit and package tests
        run: go test -race -count=1 ./...
      - name: Browser client event tests
        run: node --test internal/web/testdata/client.test.cjs
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  python-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify lock file
        shell: bash
        run: |
          uv lock --check --project actions
          diff -u \
            <(tail -n +3 actions/requirements.lock) \
            <(uv export --project actions --locked --format requirements-txt --no-dev --no-emit-project | tail -n +3)
      - name: Sync locked environment
        run: uv sync --project actions --locked
      - name: Lint
        run: uvx --from ruff==0.12.10 ruff check actions scripts/deploy/tests integration/*.py
      - name: Tests
        run: uv run --project actions python -m unittest discover -s actions/tests
      - name: Compile package
        run: uv run --project actions python -m compileall -q actions/src
      - name: Dependency audit
        run: |
          uv export --project actions --locked --format requirements-txt --no-dev --no-emit-project --output-file /tmp/buntzen-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --disable-pip -r /tmp/buntzen-requirements.txt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked Python environment
        run: uv sync --project actions --locked
      - name: Install Playwright Chromium
        run: uv run --project actions playwright install --with-deps chromium
      - name: Vet browser integration
        run: go vet -tags=integration ./integration/...
      - name: Browser integration
        run: BUNTZEN_E2E_PYTHON="$PWD/actions/.venv/bin/python" go test -race -count=1 -tags=integration -timeout=5m ./integration/...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, python-actions, integration]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose
        env:
          BLUEBUBBLES_URL: http://bluebubbles.example:1234
          BUNTZEN_ALLOWED_HOSTS: buntzen.example
          BUNTZEN_APPDATA_PATH: /tmp/buntzen-appdata
          BUNTZEN_IMAGE: ghcr.io/example/buntzen-pass-bot@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BUNTZEN_SECCOMP_PROFILE_PATH: /tmp/buntzen-seccomp.json
          BUNTZEN_WEB_PORT: "18091"
        run: |
          docker compose config --quiet
          docker compose -f deploy/portainer.yml config --quiet
      - name: Build amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: buntzen-pass-bot:ci
      - name: Runtime container smoke test
        run: bash scripts/docker_smoke.sh buntzen-pass-bot:ci
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          image-ref: buntzen-pass-bot:ci
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
