name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Open or publish the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      startsWith(needs.release-please.outputs.tag_name, 'buntzen-pass-bot-v')
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      expected_sha: ${{ needs.release-please.outputs.sha }}
      tag: ${{ needs.release-please.outputs.tag_name }}

  deploy:
    needs: publish-image
    if: needs.publish-image.result == 'success'
    permissions:
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-portainer.yml
    with:
      image_digest: ${{ needs.publish-image.outputs.image_digest }}
    secrets: inherit
