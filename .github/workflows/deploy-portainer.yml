name: Deploy Buntzen

run-name: Deploy Buntzen ${{ inputs.image_digest }}

on:
  workflow_call:
    inputs:
      image_digest:
        description: Published GHCR digest (sha256:...)
        required: true
        type: string
      confirm_stack:
        description: Exact existing Buntzen stack name; defaults to the protected environment value
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_digest:
        description: Published GHCR digest (sha256:...)
        required: true
        type: string
      confirm_stack:
        description: Exact existing Buntzen stack name
        required: true
        type: string

permissions: {}

concurrency:
  group: portainer-buntzen
  cancel-in-progress: false

jobs:
  verify-image:
    name: Verify immutable release image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Enforce main and validate the digest
        id: image
        env:
          DIGEST: ${{ inputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Buntzen deployments may only be dispatched from main." >&2
            exit 1
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "image_digest must be a sha256 digest" >&2
            exit 1
          }
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve the digest and verify signed provenance
        env:
          DIGEST: ${{ inputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          PROVENANCE_PREDICATE: https://slsa.dev/provenance/v1
          SBOM_PREDICATE: https://spdx.dev/Document/v2.3
          VULNERABILITY_PREDICATE: https://github.com/${{ github.repository }}/attestations/trivy/v1
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-image.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type "$PROVENANCE_PREDICATE" \
            --format json >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-image.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type "$SBOM_PREDICATE" \
            --format json >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-image.yml" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type "$VULNERABILITY_PREDICATE" \
            --format json >/dev/null

      - name: Re-scan the release at deployment time
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          image-ref: ${{ steps.image.outputs.image }}@${{ inputs.image_digest }}
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL
          timeout: 15m
          trivyignores: .trivyignore.yaml
          vuln-type: os,library

  deploy:
    name: Update the schedules-disabled stack
    needs: verify-image
    runs-on: [self-hosted, linux, x64, buntzen-deploy]
    timeout-minutes: 10
    environment:
      name: portainer-buntzen
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Deploy and verify Buntzen
        env:
          BUNTZEN_CONFIRM_STACK: ${{ inputs.confirm_stack || vars.PORTAINER_STACK_NAME }}
          BUNTZEN_HEALTH_URL: ${{ secrets.BUNTZEN_HEALTH_URL }}
          BUNTZEN_IMAGE: ${{ needs.verify-image.outputs.image }}@${{ inputs.image_digest }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          PORTAINER_STACK_NAME: ${{ vars.PORTAINER_STACK_NAME }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
        shell: bash
        run: ./scripts/deploy/portainer.sh deploy/portainer.yml
